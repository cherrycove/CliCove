[package]
name = "clihub"
version = "0.1.0"
description = "A lightweight local console for discovering and managing command-line tools"
authors = ["CLIHub"]
edition = "2021"

[lib]
name = "clihub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
parking_lot = "0.12"
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
