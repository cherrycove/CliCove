[package]
name = "clicove"
version = "0.6.11"
description = "A lightweight local console for discovering and managing command-line tools"
authors = ["CliCove"]
license = "MIT"
edition = "2021"

[lib]
name = "clicove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
parking_lot = "0.12"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
