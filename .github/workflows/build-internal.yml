name: Build internal installers

on:
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: 'Test the Windows installers from an existing build run instead of rebuilding'
        type: string
        default: ''

jobs:
  build:
    if: inputs.installer_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: dmg
            artifact: macOS
          - os: windows-latest
            bundles: msi,nsis
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-14' && '-' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: CliCove-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*

  test-existing-windows-installer:
    if: inputs.installer_run_id != ''
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CliCove-Windows
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: installers
      - name: Check archive and install with default and isolated temporary directories
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -ArtifactDirectory installers
